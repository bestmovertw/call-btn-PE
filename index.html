<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在為您連線專員...</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #ffffff; }
        .container { text-align: center; padding: 0 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0088cc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #555; font-size: 16px; font-weight: bold; }
        .fallback-btn { display: none; margin-top: 20px; padding: 12px 25px; font-size: 16px; font-weight: bold; color: #ffffff; background-color: #0088cc; text-decoration: none; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div id="loader" class="loader"></div>
        <p id="status-text">正在為您接通電話，請稍候...</p>
        <a id="fallback-link" href="tel:+886903573073" class="fallback-btn">若未自動撥出，請撥0903-573-073</a>
    </div>

    <script>
        const CONFIG = {
            N8N_URL: "https://n8n.parzival0626.com/webhook/88164885-9c6f-4956-9b61-593146ec099f",
            PHONE_NUMBER: "tel:+886903573073"
        };

        // 精準取得台北時間 (Asia/Taipei) 並格式化為 CASYYYYMMDDHHMM
        function generateTaipeiUserId() {
            try {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('zh-TW', {
                    timeZone: 'Asia/Taipei',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });

                const parts = formatter.formatToParts(now);
                let r = { year: '', month: '', day: '', hour: '', minute: '' };
                parts.forEach(p => { if (r[p.type] !== undefined) r[p.type] = p.value; });

                return `CAS${r.year}${r.month}${r.day}${r.hour}${r.minute}`;
            } catch (err) {
                console.error("時間序列生成失敗", err);
                return `CAS${Date.now()}`;
            }
        }

        function send(data) {
            try {
                const formData = new URLSearchParams();
                for (const key in data) { formData.append(key, data[key]); }
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(CONFIG.N8N_URL, formData);
                } else {
                    fetch(CONFIG.N8N_URL, { method: 'POST', body: formData, mode: 'no-cors' }).catch(e => console.log(e));
                }
            } catch (err) {
                console.error("數據傳送失敗", err);
            }
        }

        async function triggerTrackingAndCall() {
            const params = new URLSearchParams(window.location.search);
            
            // 擷取網址參數
            const gclid = params.get('gclid') || "";
            const gbraid = params.get('gbraid') || "";
            const wbraid = params.get('wbraid') || "";

            // 異步取得 IP 數據，但不阻礙撥號速度
            let userIp = "unknown";
            try {
                const ipResponse = await Promise.race([
                    fetch('https://api.ipify.org?format=json').then(r => r.json()),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 600))
                ]);
                if (ipResponse && ipResponse.ip) userIp = ipResponse.ip;
            } catch (e) {
                console.log("IP 取得超時，直接跳過以加速撥號");
            }

            // 產生要求的特製 UserId
            const userId = generateTaipeiUserId();

            // 打包所有數據
            const payload = {
                lineUserId: userId,      // CAS開頭 + 台北時間 (例如: CAS202605291355)
                lineName:   "電話直撥客源",
                gclid:      gclid,
                gbraid:     gbraid,
                wbraid:     wbraid,
                user_ip:    userIp,
                source:     "Auto_Phone_Trigger",
                timestamp:  new Date().toISOString()
            };

            // 1. 發送追蹤數據給 n8n
            send(payload);

            // 2. 延遲 50 毫秒確保瀏覽器執行發送後，立刻喚起撥號畫面
            setTimeout(() => {
                window.location.href = CONFIG.PHONE_NUMBER;
                
                // 顯示備用按鈕，防止部分特殊瀏覽器攔截自動撥號
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status-text').innerText = "已為您喚起電話撥打介面。";
                document.getElementById('fallback-link').style.display = 'inline-block';
            }, 50);
        }

        // 頁面載入完成後直接執行
        window.addEventListener('DOMContentLoaded', triggerTrackingAndCall);
    </script>
</body>
</html>
